<script type="text/x-dc" data-dc-script data-props='{"capColor":{"editor":"color","default":"#2B9EF0","options":["#2B9EF0","#1DC48A","#FF6B35"]},"tilt":{"editor":"range","default":-8,"min":-20,"max":20,"step":1,"unit":"°"},"logoOpacity":{"editor":"range","default":0.82,"min":0.2,"max":1,"step":0.02},"showSample":{"editor":"boolean","default":false},"$preview":{"width":800,"height":800}}'>
class Component extends DCLogic {
  mix(hex, target, t) {
    var h = (hex || '#2B9EF0').replace('#', '');
    if (h.length === 3) { h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2]; }
    var n = parseInt(h, 16);
    var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    var tr = target === 'white' ? 255 : 0;
    var f = function (c) { return Math.round(c + (tr - c) * t); };
    var s = function (c) { var x = f(c).toString(16); return x.length < 2 ? '0' + x : x; };
    return '#' + s(r) + s(g) + s(b);
  }
  renderVals() {
    var c = this.props.capColor ?? '#2B9EF0';
    var tilt = this.props.tilt ?? -8;
    return {
      capMid: c,
      capLight: this.mix(c, 'white', 0.28),
      capHigh: this.mix(c, 'white', 0.55),
      capDark: this.mix(c, 'black', 0.28),
      capDeep: this.mix(c, 'black', 0.55),
      tilt: tilt,
      shadowX: 400 + tilt * 0.6,
      logoOpacity: this.props.logoOpacity ?? 0.82,
      sampleOpacity: (this.props.showSample ?? false) ? 1 : 0
    };
  }
}
