# Saludly Brain · Motor de análisis · Parte 1 (cálculos y clasificación)
# Reglas como datos: si una cambia, cambia aquí y se vuelven a correr las pruebas.
# Cada regla cita la ficha del Knowledge Base de donde sale.

limitrofe:
  # Dentro del intervalo del laboratorio pero fuera de un umbral clínico definido en una ficha
  alt:
    fuente: COND-M4-GA-002
    hombre: {sobre: 33}
    mujer: {sobre: 25}
  tsh:
    fuente: COND-M2-TI-001
    nota: "zona entre el límite del laboratorio y el corte del consenso colombiano se clasifica como alto por el laboratorio; aquí solo se marca la zona de vigilancia dentro del intervalo"
  ferritin:
    fuente: COND-M3-HE-003
    zona: {desde: 15, hasta: 29.99}

critico_por_guia:
  # Umbrales de urgencia escritos en una guía o ficha (documento 04: Saludly no inventa umbrales de urgencia)
  glucose: {menor_que: 54, fuente: "COND-M1-EM-005 (ADA, hipoglucemia nivel 2)", requiere: "muestra confiable"}
  hs_troponin: {mayor_que_limite_superior: true, fuente: "SEG-001"}

no_interpretable_por_contexto:
  ayuno_minimo_8h: [glucose, triglycerides, insulin, homa_ir, ldl_c, remnant_cholesterol, vitamin_k1, phenoage]
  cortisol_fuera_de_6_a_10: [cortisol]
  biotina: [tsh, free_t4, total_t3, anti_tpo, anti_tg, vitamin_b12, folate, igf1]
  hormonas_de_fase: [fsh, lh, estradiol, progesterone]   # sin fecha de última menstruación, con anticonceptivo hormonal, embarazo o menopausia
  embarazo: [fsh, lh, estradiol, progesterone, prolactin, testosterone_total, shbg, alp, phenoage]
  vitamina_c_sin_transporte_validado: [vitamin_c]
  menstruacion: [urinalysis]   # solo el campo de sangre y los hematíes del sedimento

panel:
  # Decisión de Carlos (10 de octubre de 2026): el MVP usa solo pruebas de sangre; orina y heces quedan en pausa.
  # El contexto de la visita puede pedir panel: "completo" para evaluarlas (así corren las pruebas de las partes 1 a 4).
  modo_por_defecto: solo_sangre
  solo_sangre:
    biomarcadores_pausados: [urinalysis, uacr, fit_stool, hpylori_stool_ag, stool_exam]
    # Decisión de Carlos (10 de octubre de 2026): estas 10 salieron del panel base. Si el laboratorio las envía igual,
    # el lector las lee, pero el motor no las interpreta ni las muestra al paciente (quedan anotadas para el médico).
    # La interferencia por biotina se controla con la pregunta "¿tomas biotina?".
    biomarcadores_fuera_del_panel: [vitamin_a, vitamin_e, vitamin_k1, vitamin_c, vitamin_b1, biotin, niacin, coq10, omega3_index, omega6_omega3_ratio]
    condiciones_pausadas: [COND-M2-NE-002, COND-M2-NE-006, COND-M4-GA-004, COND-M4-GA-005, COND-M4-IN-A01, COND-M4-IN-A02]
    relaciones_pausadas: [REL-010]
    seguridad_pausada: [SEG-013]
    # Se siguen evaluando, pero les falta la parte de orina o heces
    parciales:
      COND-M2-NE-001: "solo con la TFG; sin estadio de albuminuria (orina en pausa)"
      COND-M2-NE-003: "solo con la TFG; sin albuminuria (orina en pausa)"
      COND-M2-NE-A02: "sin albuminuria para descartar daño renal (orina en pausa)"
      COND-M3-HE-002: "sin sangre oculta en heces para buscar la causa (heces en pausa)"
      COND-M3-HE-A03: "sin coprológico para cruzar con parásitos (heces en pausa)"

altitud:
  # OMS 2024: ajuste de hemoglobina por altitud de residencia (g/dL a restar)
  fuente: "OMS 2024, cortes de hemoglobina"
  ciudades_metros: {Bogotá: 2640, Medellín: 1495, Cali: 1000, Barranquilla: 18, Cartagena: 2, Bucaramanga: 959, Pereira: 1411, Manizales: 2160, Tunja: 2820, Pasto: 2527, Popayán: 1760}
  tabla:
    - {desde: 2500, hasta: 2999, restar: 1.8}
  por_verificar: "Solo la franja de 2.500 a 2.999 m está escrita (Lote 3). Las demás franjas deben copiarse de la tabla OMS 2024 antes de atender pacientes fuera de esa altitud."

tabaquismo:
  fuente: "OMS 2024"
  por_verificar: "Los valores del ajuste por tabaquismo no están escritos; mientras tanto no se ajusta y se marca la duda."
