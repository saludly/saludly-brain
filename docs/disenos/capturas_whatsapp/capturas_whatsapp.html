<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Color+Emoji&display=swap">
<style>
/* Layout: tres capturas de pantalla de iPhone lado a lado, cada una con su nota; la página es solo la mesa de revisión */
:root{
  --bg:#eef1f0; --fg:#18211e; --muted:#5b6964; --card:#ffffff; --line:#d7dedb; --accent:#0f6b57;
  --ui:"Inter","SF Pro Text",-apple-system,"Segoe UI",system-ui,sans-serif;
  --emoji:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111816;--fg:#e5ece9;--muted:#9aa9a4;--card:#18211e;--line:#2a3833;--accent:#5cc4a8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111816;--fg:#e5ece9;--muted:#9aa9a4;--card:#18211e;--line:#2a3833;--accent:#5cc4a8;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--ui)}
.wrap{max-width:1360px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:24px}
h1{font-size:28px;margin:0;text-wrap:balance}
.lead{color:var(--muted);max-width:70ch;margin:8px 0 0;line-height:1.5}
.row{display:flex;flex-wrap:wrap;gap:28px;justify-content:center}
.item{display:flex;flex-direction:column;gap:12px;width:402px;max-width:100%}
.item h2{font-size:17px;margin:0}
.item p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.shot-box{width:100%;aspect-ratio:402/874;position:relative;overflow:hidden}
.scaler{position:absolute;top:0;left:0;width:402px;height:874px;transform-origin:0 0}

/* ===== Pantalla de iPhone (402 × 874 pt) con WhatsApp en tema claro ===== */
.phone{width:402px;height:874px;position:relative;overflow:hidden;background:#efeae2;font-family:var(--ui);color:#111b21;-webkit-font-smoothing:antialiased}
.phone .wall{position:absolute;inset:0;background-color:#efeae2;background-image:var(--doodle);background-size:260px 260px;opacity:1}
.status{position:absolute;top:0;left:0;right:0;height:54px;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 50px;font:600 17px/1 var(--ui);letter-spacing:-.2px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:125px;height:37px;border-radius:20px;background:#000}
.sicons{display:flex;gap:6px;align-items:center}
.top{position:absolute;top:0;left:0;right:0;height:108px;background:rgba(246,245,243,.94);backdrop-filter:blur(20px);z-index:4;border-bottom:.5px solid rgba(0,0,0,.12)}
.nav{position:absolute;top:54px;left:0;right:0;height:54px;display:flex;align-items:center;padding:0 14px 0 8px;gap:8px;z-index:5}
.back{display:flex;align-items:center;gap:2px;font:400 17px var(--ui);color:#000}
.back .n{background:#e9e9eb;border-radius:12px;padding:2px 8px;font-size:15px;font-weight:500}
.avatar{width:38px;height:38px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;border:.5px solid rgba(0,0,0,.08);flex:0 0 auto}
.who{flex:1;min-width:0;line-height:1.15}
.who b{display:block;font:600 17px var(--ui);letter-spacing:-.3px}
.who span{font-size:12.5px;color:#667781}
.acts{display:flex;gap:22px;align-items:center}
.chat{position:absolute;top:108px;left:0;right:0;bottom:0;padding:8px 0 0;display:flex;flex-direction:column;gap:3px;z-index:1}
.chip{align-self:center;background:#fff;color:#54656f;font:500 12.5px var(--ui);padding:5px 12px;border-radius:8px;margin:8px 0 6px;box-shadow:0 1px .5px rgba(11,20,26,.13)}
.b{position:relative;max-width:318px;padding:6px 9px 8px 10px;border-radius:9px;font-size:16.2px;line-height:1.32;white-space:normal;overflow-wrap:break-word;box-shadow:0 1px .5px rgba(11,20,26,.13);letter-spacing:-.15px}
.b .e{font-family:var(--emoji);font-size:15px}
.b b{font-weight:600}
.in{align-self:flex-start;margin-left:16px;background:#fff;border-top-left-radius:0}
.out{align-self:flex-end;margin-right:16px;background:#d9fdd3;border-top-right-radius:0}
.in.tail::before{content:"";position:absolute;left:-8px;top:0;border-width:0 9px 10px 0;border-style:solid;border-color:transparent #fff transparent transparent}
.out.tail::before{content:"";position:absolute;right:-8px;top:0;border-width:0 0 10px 9px;border-style:solid;border-color:transparent transparent transparent #d9fdd3}
.in:not(.tail),.out:not(.tail){border-radius:9px}
.t{float:right;margin:8px 0 -5px 10px;font-size:11.5px;color:#667781;line-height:1;display:inline-flex;gap:3px;align-items:center;position:relative;top:4px}
.gap{height:6px}
.bottom{position:absolute;left:0;right:0;bottom:0;height:88px;background:rgba(246,245,243,.96);backdrop-filter:blur(20px);border-top:.5px solid rgba(0,0,0,.12);z-index:4}
.bar{position:absolute;top:8px;left:12px;right:12px;height:38px;display:flex;align-items:center;gap:12px}
.field{flex:1;height:36px;border-radius:18px;background:#fff;border:.5px solid rgba(0,0,0,.15);display:flex;align-items:center;justify-content:flex-end;padding:0 10px}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:139px;height:5px;border-radius:3px;background:#000}
.down{position:absolute;right:14px;bottom:100px;width:38px;height:38px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);z-index:4;display:flex;align-items:center;justify-content:center}
.down i{position:absolute;top:-6px;right:-4px;background:#25d366;color:#fff;font:700 11.5px/18px var(--ui);min-width:18px;height:18px;border-radius:9px;text-align:center;font-style:normal;padding:0 5px}
</style>

<div class="wrap">

</div>

const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const EMO = /(\p{Extended_Pictographic}(?:️|‍\p{Extended_Pictographic})*)/gu;
const fmt = s => esc(s).replace(new RegExp(EMO.source+" ?","gu"),"").replace(/ +([.,])/g,"$1").replace(/\*([^*\n]+)\*/g,"<b>$1</b>").replace(/\n/g,"<br>");

function bubble(m){
  if(m.chip) return `<div class="chip">${m.chip}</div>`;
  if(m.gap) return `<div class="gap"></div>`;
  const cls = (m.out?"out":"in")+(m.tail?" tail":"");
  const t = `<span class="t">${m.h}${m.out?SVGI.checks:""}</span>`;
  return `<div class="b ${cls}">${fmt(m.x)}${t}</div>`;
}
function phone(s){
  return `<div class="phone">

    <div class="top"></div>
    <div class="status"><span>${s.hora}</span><div class="island"></div><span class="sicons">${SVGI.signal}${SVGI.wifi}${SVGI.battery}</span></div>

}
