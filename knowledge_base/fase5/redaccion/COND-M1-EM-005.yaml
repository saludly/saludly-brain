id: COND-M1-EM-005
tipo: condicion
titulo_paciente: "Glucosa en ayunas más baja de lo esperado"
que_es: "La glucosa es el azúcar de la sangre y es el combustible principal del cerebro."
por_que_te_aparece:
  - "Tu glucosa en ayunas salió en {glucose}, por debajo de 70 mg/dL."
riesgo_claro: "Si la glucosa baja de verdad con frecuencia, puede causar mareo, sudor frío, temblor o desmayos, y conviene saber por qué pasa."
ejemplo_simple: "Es como un carro que marca poca gasolina: puede ser el tanque o puede ser el medidor, y hay que revisar cuál."
incertidumbre: "Muchas veces es un falso bajo por la demora en procesar la muestra. Hay que repetirla, y tu médico decide si hace falta estudiar más."
