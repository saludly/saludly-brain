  - "Tus eosinófilos salieron en {eosinofilos_abs}, por encima del rango."
  - "En porcentaje de tus glóbulos blancos, salieron en {eosinophils_pct}."
riesgo_claro: "Si la causa no se identifica, puede seguir actuando en el cuerpo sin que lo notes. Por eso vale la pena revisarla."
ejemplo_simple: "Son como un grupo especial de bomberos: si hay muchos en la calle, es porque algo los llamó."
incertidumbre: "Las causas más comunes son alergias, asma, algunos medicamentos o parásitos. Lo cruzamos con tu examen de heces, y tu médico confirma la causa."
