id: COND-M3-HE-003
tipo: condicion
titulo_paciente: "Reservas de hierro bajas, sin anemia"
que_es: "La ferritina es la reserva de hierro de tu cuerpo; el hierro sirve para fabricar glóbulos rojos y para tener energía."
por_que_te_aparece:
  - "Tu ferritina, que es la reserva de hierro de tu cuerpo, salió en {ferritin}, más baja de lo recomendado."
  - "Tu hemoglobina, ajustada por la altura de Bogotá, salió en {hemoglobina_ajustada}, todavía en el rango esperado."
riesgo_claro: "Si las reservas siguen bajando, con el tiempo puede aparecer anemia, con más cansancio y menos rendimiento físico."
ejemplo_simple: "Es como la batería del celular en amarillo: todavía funciona, pero conviene cargarla antes de que se apague."
incertidumbre: "Un solo examen no basta: la inflamación y los suplementos recientes cambian la ferritina. Es un buen momento para mejorar la alimentación y revisar con tu médico por qué pasa."
