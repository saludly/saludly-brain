id: COND-M4-GA-005
tipo: condicion
titulo_paciente: "Bacteria H. pylori en la muestra de heces"
que_es: "La H. pylori es una bacteria muy común que vive en el estómago y muchas veces no da síntomas."
por_que_te_aparece:
  - "En tu muestra de heces se detectó la bacteria H. pylori."
riesgo_claro: "Si no se trata, con los años puede irritar el estómago y favorecer heridas en su pared."
ejemplo_simple: "Es como una gotera pequeña: hoy no molesta, pero con los años va dañando el techo si no se arregla."
incertidumbre: "Las guías colombianas recomiendan tratarla aunque no tengas síntomas. Tu médico confirma el resultado y decide el tratamiento en una consulta en las próximas semanas; no te automediques con antibióticos."
cuando_consultar: null
aviso_whatsapp: null
fuentes: ["Asociación Colombiana de Gastroenterología 2025, H. pylori"]
