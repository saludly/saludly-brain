id: COND-M3-HE-009
tipo: condicion
titulo_paciente: "Glóbulos rojos más grandes de lo normal"
que_es: "El volumen corpuscular medio mide el tamaño promedio de tus glóbulos rojos, las células que llevan el oxígeno."
por_que_te_aparece:
  - "Tu volumen corpuscular medio salió en {mcv}, por encima de lo normal."
  - "Tu hemoglobina, ajustada por la altura de Bogotá, salió en {hemoglobina_ajustada}, en el rango esperado."
  - "Tu GGT, una enzima del hígado que puede subir con el alcohol y otras causas, salió en {ggt}."
riesgo_claro: "Por sí solo no suele dar síntomas, pero si la causa de fondo no se atiende, con el tiempo puede aparecer anemia o afectarse los nervios."
ejemplo_simple: "Es como un testigo en el tablero del carro: no es la falla, pero avisa que conviene revisar el motor."
incertidumbre: "Este patrón es compatible con varias causas, como el alcohol, la vitamina B12, el folato o la tiroides. Tu médico lo confirma, a veces repitiendo el hemograma con esas vitaminas."
cuando_consultar: null
aviso_whatsapp: null
fuentes: ["BSH, evaluación de la macrocitosis"]
estado_revision: pendiente
