id: SEG-012
tipo: seguridad
titulo_paciente: "Un valor de su hemograma fuera del rango"
que_es: "El hemograma cuenta y mide las células de la sangre: glóbulos rojos, glóbulos blancos y plaquetas."
por_que_te_aparece:
  - "Sus monocitos, un tipo de glóbulo blanco, salieron en {monocytes_pct}."
  - "Sus basófilos, otro tipo de glóbulo blanco, salieron en {basophils_pct}."
  - "Su hematocrito, la proporción de la sangre que ocupan los glóbulos rojos, salió en {hematocrit}, y sus glóbulos rojos en {erythrocytes}."
  - "Su HCM y su CHCM, que miden la hemoglobina dentro de cada glóbulo rojo, salieron en {mch} y {mchc}."
  - "Su VPM, el tamaño promedio de sus plaquetas, salió en {mpv}."
riesgo_claro: "Un valor aislado fuera de rango muchas veces no tiene importancia. Pero si se mantiene o se suma a otros cambios, conviene buscar la causa."
ejemplo_simple: "Es como un dato raro en una encuesta: puede ser casualidad; por eso se mira de nuevo antes de sacar conclusiones."
incertidumbre: "Una gripa reciente, la deshidratación o la altura de Bogotá pueden mover estos valores. Su médico decide si hay que repetir el hemograma."
cuando_consultar: null
aviso_whatsapp: "Hay un valor de su hemograma en su informe de Saludly para comentar con su médico."
fuentes: ["Fichas del hemograma en el Knowledge Base"]
estado_revision: aprobada
