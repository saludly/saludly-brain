tipo: patron
titulo_paciente: "Unas enzimas que probablemente vienen del músculo"
que_es: "La CK es una enzima de los músculos. Cuando los músculos trabajan fuerte, sueltan a la sangre la CK y otras enzimas, como la AST y la LDH."
por_que_te_aparece:
  - "Su CK, una enzima de los músculos, salió en {ck_cpk}."
  - "Su AST, una enzima que está en el hígado y en los músculos, salió en {ast}."
  - "Su LDH, una enzima presente en muchos tejidos, salió en {ldh}."
riesgo_claro: "Lo más común es que se deba a ejercicio reciente. Si se repite sin ejercicio o hay dolor muscular, conviene revisarlo con su médico."
ejemplo_simple: "Es como el aserrín después de cortar madera: indica que hubo trabajo, no que algo esté roto."
incertidumbre: "El ejercicio intenso de los dos días anteriores y algunos medicamentos para el colesterol lo explican con frecuencia. Conviene repetir el examen sin entrenar fuerte antes."
