id: COND-M6-MI-A02
tipo: condicion
titulo_paciente: "Su edad biológica estimada"
que_es: "La edad biológica es una estimación de cómo está funcionando su cuerpo, calculada con un modelo científico a partir de 9 de sus resultados y su edad."
por_que_te_aparece:
  - "Con su albúmina, creatinina, glucosa, proteína C reactiva y hemograma, el modelo estima su edad biológica en {phenoage}."
  - "Algunos valores, como su proteína C reactiva ({hs_crp}) o su RDW ({rdw}), pueden mover la estimación por causas pasajeras."
riesgo_claro: "Una edad biológica mayor que su edad real es una invitación a cuidar el sueño, la actividad física y la alimentación. No predice lo que le va a pasar."
ejemplo_simple: "Es como el kilometraje de un carro frente a su año de fabricación: dos carros del mismo año pueden estar más o menos gastados según cómo se usaron."
incertidumbre: "Es una estimación de un modelo hecho en Estados Unidos, sin validación conocida en Colombia. Sirve más para ver cómo cambia en el tiempo que como dato aislado."
cuando_consultar: null
aviso_whatsapp: "Ya está en su informe de Saludly la estimación de su edad biológica. Ábralo cuando pueda."
fuentes: ["Levine et al. 2018, Aging 10(4):573-591"]
estado_revision: aprobada
