id: COND-M5-MU-001
tipo: condicion
titulo_paciente: "Sus hormonas masculinas (andrógenos) están por encima del rango"
que_es: "Los andrógenos, como la testosterona, son hormonas que las mujeres también producen, en menor cantidad que los hombres."
por_que_te_aparece:
  - "Su testosterona total salió en {testosterone_total}, por encima del rango para mujeres."
  - "Su índice de andrógenos libres, que estima la parte de la testosterona que está activa, salió en {indice_androgenos_libres}."
  - "Su SHBG, la proteína que transporta estas hormonas en la sangre, salió en {shbg}."
riesgo_claro: "Si se mantienen altos, los andrógenos pueden relacionarse con ciclos irregulares, acné, más vello y dificultad para manejar el azúcar."
ejemplo_simple: "Es como subirle el volumen a una emisora: la música es la misma, pero se nota más de lo habitual."
incertidumbre: "Un valor alto puede tener varias explicaciones y por sí solo no confirma nada. Su médico lo interpreta junto con sus ciclos y sus síntomas."
cuando_consultar: "Coménteselo a su médico o a ginecología, sobre todo si sus ciclos menstruales son irregulares."
aviso_whatsapp: "Hay un resultado hormonal en su informe de Saludly para revisar. Ábralo cuando pueda."
fuentes: ["Guía internacional de SOP 2023"]
estado_revision: aprobada
