id: COND-M3-HE-007
tipo: condicion
titulo_paciente: "Su hemoglobina está más alta de lo esperado para la altura de Bogotá"
que_es: "La hemoglobina es la proteína de los glóbulos rojos que lleva el oxígeno. En Bogotá es normal que sea algo más alta por la altura."
por_que_te_aparece:
  - "Su hemoglobina salió en {hemoglobin}. Aun comparada con el límite más alto que se usa para la altura de Bogotá, donde hay menos oxígeno, está por encima de lo esperado."
  - "Su hematocrito, que es la parte de la sangre ocupada por glóbulos rojos, salió en {hematocrit}."
riesgo_claro: "Si se mantiene alta mucho tiempo sin revisarse, la sangre circula con más dificultad y aumenta la probabilidad de problemas en la circulación."
ejemplo_simple: "Es como una vía con demasiados carros: todos avanzan, pero el tráfico se vuelve más lento."
incertidumbre: "Lo más común es que se deba al cigarrillo, a hormonas o a poca hidratación. Un solo examen no basta: conviene repetirlo y que su médico lo revise."
cuando_consultar: "Si tiene dolor de cabeza frecuente, mareo o enrojecimiento de la cara, consulte antes."
aviso_whatsapp: null
fuentes: ["OMS 2024, cortes de hemoglobina y ajuste por altitud", "BSH 2019, investigación de la eritrocitosis", "OMS 2016, criterios de policitemia vera"]
estado_revision: aprobada
