id: REL-001
tipo: patron
titulo_paciente: "Su azúcar y sus grasas se mueven juntos"
que_es: "Cuando al cuerpo le cuesta más manejar el azúcar, varios resultados cambian a la vez: la glucosa, la insulina, los triglicéridos y el colesterol bueno."
por_que_te_aparece:
  - "Su glucosa en ayunas salió en {glucose}, y su hemoglobina glicada, el promedio de azúcar de los últimos 3 meses, en {hba1c}."
  - "Sus triglicéridos, un tipo de grasa en la sangre, salieron en {triglycerides}, y su colesterol HDL, el colesterol bueno, en {hdl_c}."
  - "Su índice HOMA-IR, que estima cuánto le cuesta a la insulina hacer su trabajo, salió en {homa_ir}."
riesgo_claro: "Si este patrón se mantiene durante años, aumenta la probabilidad de llegar a diabetes y de que se dañen los vasos sanguíneos del corazón. La buena noticia: como van juntos, los mismos hábitos mejoran todos a la vez."
ejemplo_simple: "Es como una cocina donde la nevera ya no cierra bien: no falla una sola cosa; todo el sistema trabaja de más."
incertidumbre: "Este patrón no es un diagnóstico. Un ayuno incompleto o algunos medicamentos pueden mover estos valores, y su médico decide si hay que repetirlos."
cuando_consultar: null
aviso_whatsapp: null
fuentes: ["ADA Standards of Care 2026", "IDF/AHA/NHLBI 2009"]
estado_revision: aprobada
