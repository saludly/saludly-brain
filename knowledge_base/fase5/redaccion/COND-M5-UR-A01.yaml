id: COND-M5-UR-A01
tipo: condicion
titulo_paciente: "Su testosterona libre calculada"
que_es: "La testosterona libre es la parte que no va pegada a proteínas y que sí actúa en el cuerpo. Se calcula con tres de sus resultados."
por_que_te_aparece:
  - "Su testosterona libre calculada salió en {testosterone_free}."
  - "Se calculó con su testosterona total ({testosterone_total}), su SHBG ({shbg}) y su albúmina ({albumin})."
riesgo_claro: "Si se mantiene baja, puede relacionarse con cansancio, menos deseo sexual y pérdida de músculo, aunque la testosterona total se vea normal."
ejemplo_simple: "Es como la plata de su billetera frente a la que está en una cuenta bloqueada: para el día a día cuenta la que usted puede usar."
incertidumbre: "Es un cálculo, no una medición directa, y depende de la fórmula y del laboratorio. Su médico lo lee junto con la testosterona total."
cuando_consultar: null
aviso_whatsapp: null
fuentes: ["Endocrine Society 2018"]
estado_revision: aprobada
