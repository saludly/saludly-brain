id: REL-006
tipo: patron
titulo_paciente: "Su hígado y su metabolismo cuentan la misma historia"
que_es: "Las enzimas del hígado, como la ALT y la GGT, suben cuando sus células trabajan de más, por ejemplo cuando se acumula grasa en él."
por_que_te_aparece:
  - "Su ALT, una enzima del hígado, salió en {alt}."
  - "Su GGT, otra enzima del hígado, salió en {ggt}."
  - "Sus triglicéridos, un tipo de grasa en la sangre, salieron en {triglycerides}."
riesgo_claro: "Si se mantiene por años, la grasa y la inflamación en el hígado pueden ir dejando cicatrices que afectan su funcionamiento. La buena noticia: el hígado mejora mucho con la alimentación y el movimiento."
ejemplo_simple: "Es como una bodega a la que llega más mercancía de la que puede despachar: se va llenando y el trabajo se vuelve pesado."
incertidumbre: "El alcohol o el ejercicio intenso de los días previos y algunos medicamentos también suben estas enzimas. Hace falta ver si se mantienen en los próximos meses."
cuando_consultar: null
aviso_whatsapp: null
fuentes: ["ACG 2017", "EASL-EASD-EASO 2024"]
estado_revision: aprobada
