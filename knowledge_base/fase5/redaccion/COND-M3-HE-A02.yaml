titulo_paciente: "Glóbulos blancos fuera del rango"
que_es: "Los glóbulos blancos son las células de defensa del cuerpo; los neutrófilos y los linfocitos son dos de sus tipos principales."
por_que_te_aparece:
  - "Tus glóbulos blancos totales salieron en {wbc}."
