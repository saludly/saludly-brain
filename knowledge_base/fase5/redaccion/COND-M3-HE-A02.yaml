riesgo_claro: "Casi siempre es pasajero, pero si se mantiene fuera del rango y no se revisa, se podría pasar por alto una causa que sí conviene atender."
ejemplo_simple: "Es como el número de vigilantes de un edificio: sube o baja según lo que haya pasado en los últimos días."
incertidumbre: "Es frecuente después de una infección, con ejercicio intenso, con el cigarrillo o con algunos medicamentos. Un solo examen no basta: conviene repetirlo y revisarlo con tu médico."
