nota: Generado por codigo/herramientas/generar_frases_prohibidas.py. Los patrones se evalúan sobre texto en minúsculas y sin tildes.
patrones:
- id: diagnostico_tienes
  patron: \b(tienes|padeces|sufres de|eres|estas enfermo|estas enferma)\s+(un[ao]?\s+)?(diabet|hipertens|anemi|hipotiroid|hipertiroid|cancer|leucemi|mieloma|lupus|artritis|cirrosis|hepatitis|chagas|insuficiencia|enfermedad|sindrome|talasemi|policitemi|trombocitemi|gammapati|sop\b|ovario
    poliquistico|addison|hashimoto|graves|celiac|gota|higado graso|deficiencia|deficit)
  motivo: diagnóstico afirmado
- id: diagnostico_eres
  patron: \beres (diabetic|hipertens|anemic|celiac)
  motivo: etiqueta de enfermedad
- id: dosis
  patron: \b\d+([.,]\d+)?\s*(mg|mcg|µg|ug|ui|iu|tabletas?|capsulas?|gotas)\s+(de|al dia|diari)
  motivo: dosis o prescripción
- id: toma_suplemento
  patron: \btoma\s+(un|una|el|la)?\s*(suplemento|capsula|tableta|pastilla)
  motivo: prescripción de suplemento
- id: porcentaje_riesgo
  patron: \b(riesgo|probabilidad)\b[^.]{0,40}\b\d+\s*%
  motivo: porcentaje de riesgo sin modelo validado
- id: falsa_tranquilidad
  patron: \b(estas sano|estas sana|no es nada|no tienes nada|todo esta perfecto)\b
  motivo: falsa tranquilidad
- id: alarmismo
  patron: \b(es grave|es muy grave|peligro de muerte|vas a morir|urgente urgente)\b
  motivo: alarmismo
- id: cura
  patron: \b(cura|curar|garantiza|garantizado|milagro)\b
  motivo: promesa de cura
- id: wearable_diagnostico
  patron: \b(reloj|wearable|apple watch)\b[^.]{0,40}\b(detecto|diagnostico)\b
  motivo: el wearable no diagnostica
- id: suspender_medicamento
  patron: \b(suspende|deja de tomar|deja tu)\s+(el|la|tu|los|las)?\s*(medicamento|tratamiento|pastilla)
  motivo: cambiar un tratamiento
