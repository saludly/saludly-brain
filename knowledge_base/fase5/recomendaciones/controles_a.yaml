# Recomendaciones de controles · lote A (M1, M2, M5, sus patrones, generales y por objetivo)
# Numeración 100 a 199. Pendiente de revisión de Carlos.
# Los plazos de repetición vienen de las fichas (recomendaciones_sugeridas); el médico revisor los confirma.
# 20 de octubre de 2026: textos pasados a "usted" con emoji en WhatsApp; aprobado por Carlos el 20 de octubre de 2026.

- id: REC-CTL-101
  tipo: controles
  titulo: "Revise su glucosa con su médico"
  texto_base: "Lleve este resultado a su médico para confirmarlo. Si le repiten el examen, vaya con 8 horas o más de ayuno y cuente si usa corticoides."
  meta_concreta: "Pida su cita en las próximas 4 semanas."
  por_que: "Un solo examen no basta: confirmarlo permite actuar a tiempo y con el plan adecuado."
  se_activa_con: ["COND-M1-EM-001", "COND-M1-EM-003", "COND-M1-EM-A04"]
  prioriza_objetivos: ["prevenir", "condicion_existente", "salud_general"]
  contraindicada_si: []
  requiere_consulta_previa: false
  whatsapp: "📅 Recuerde pedir su cita para revisar sus resultados de glucosa. Si le repiten el examen, vaya en ayunas."
  fuentes: ["ADA Standards of Care in Diabetes 2025, sección 2", "GPC Colombia DM2 2016"]

- id: REC-CTL-102
  tipo: controles
  titulo: "Consulte pronto para confirmar y planear"
  texto_base: "Pida una cita médica en las próximas semanas para confirmar este resultado y definir un plan con usted. Lleve este informe."
  meta_concreta: "Pida la cita esta semana."
  por_que: "Este resultado necesita una evaluación médica para decidir los siguientes pasos."
  se_activa_con: ["COND-M1-EM-002", "COND-M1-EM-A03", "COND-M1-CA-007", "COND-M2-NE-003", "COND-M2-TI-002", "COND-M2-TI-005"]
  prioriza_objetivos: ["condicion_existente", "prevenir", "salud_general"]
  contraindicada_si: []
  requiere_consulta_previa: false
  whatsapp: "📅 Le recordamos pedir su cita médica esta semana para revisar sus resultados. Lleve su informe de Saludly."
  fuentes: ["ADA Standards of Care in Diabetes 2025, sección 2", "KDIGO 2024 Clinical Practice Guideline for CKD", "ATA Guidelines for the Treatment of Hypothyroidism 2014"]

- id: REC-CTL-103
  tipo: controles
  titulo: "Tómese la presión en casa por 7 días"
  texto_base: "Mida su presión en casa durante 7 días, en la mañana y en la noche, sentado, tras 5 minutos de reposo, sin café ni cigarrillo 30 minutos antes. Anote los valores y llévelos a su médico."
  meta_concreta: "Siete días seguidos de medición, mañana y noche, anotados en una tabla."
  por_que: "Una sola toma puede salir alta por nervios o esfuerzo; varias tomas en casa dan una imagen más real."
  se_activa_con: ["COND-M1-CA-006", "COND-M1-CA-005", "COND-M2-TI-008", "COND-M2-NE-001", "COND-M2-NE-002", "COND-M2-NE-003", "REL-010"]
  prioriza_objetivos: ["prevenir", "condicion_existente", "envejecer_saludable"]
  contraindicada_si: []
  requiere_consulta_previa: false
  whatsapp: "🩺 Esta semana mida su presión en casa en la mañana y en la noche, sentado y en calma. Anótela para llevarla a su médico."
  fuentes: ["GPC Colombia HTA 2025 (Minsalud e IETS)", "2017 ACC/AHA Guideline for High Blood Pressure in Adults"]

- id: REC-CTL-104
  tipo: controles
  titulo: "Repita los exámenes del riñón en 3 meses"
  texto_base: "Repita la creatinina en unos 3 meses, sin ejercicio intenso las 48 horas antes, y pregúntele a su médico si también necesita el examen de proteína en la orina (relación albúmina/creatinina)."
  meta_concreta: "Agende hoy en su calendario la fecha para repetir el examen en 3 meses."
  por_que: "Estos valores cambian de un día a otro; repetirlos confirma si el hallazgo se mantiene."
  se_activa_con: ["COND-M2-NE-001", "COND-M2-NE-002", "COND-M2-NE-003", "REL-010"]
  prioriza_objetivos: ["prevenir", "condicion_existente", "envejecer_saludable"]
  contraindicada_si: []
  requiere_consulta_previa: false
  whatsapp: "📅 Ponga hoy en su calendario el recordatorio para repetir sus exámenes del riñón en 3 meses."
  fuentes: ["KDIGO 2024 Clinical Practice Guideline for CKD"]

- id: REC-CTL-105
  tipo: controles
  titulo: "Repita el potasio pronto"
  texto_base: "Repita el potasio en los próximos días, como indique su médico. Ese día no apriete el puño durante la toma y cuéntele al laboratorio qué medicamentos usa."
  meta_concreta: "Repita el examen en los próximos 7 días."
  por_que: "El potasio puede salir alto por cómo se tomó o se procesó la muestra; repetirlo aclara si es real."
  se_activa_con: ["COND-M2-NE-004", "potassium:alto"]
  prioriza_objetivos: ["condicion_existente", "salud_general", "prevenir"]
  contraindicada_si: []
  requiere_consulta_previa: false
  whatsapp: "🧪 Recuerde repetir su examen de sangre en los próximos días, como lo indique su médico."
  fuentes: ["KDIGO Controversies Conference on Potassium 2020"]

- id: REC-CTL-106
  tipo: controles
  titulo: "Repita el sodio y revise sus medicamentos"
  texto_base: "Repita el sodio como indique su médico y lleve la lista de sus medicamentos, porque algunos para la presión o el ánimo lo pueden bajar."
  meta_concreta: "Pida su cita en las próximas 2 semanas con la lista de medicamentos."
  por_que: "El sodio bajo puede deberse a medicamentos o a tomar mucha agua; su médico lo aclara."
  se_activa_con: ["COND-M2-NE-005", "sodium:bajo"]
  prioriza_objetivos: ["condicion_existente", "maraton", "salud_general"]
  contraindicada_si: []
  requiere_consulta_previa: false
  whatsapp: "📋 Recuerde pedir su cita para repetir su examen de sangre. Lleve la lista de los medicamentos que usa."
  fuentes: ["Guía europea de hiponatremia 2014 (Spasovski et al.)"]

- id: REC-CTL-107
  tipo: controles
  titulo: "Repita el examen de orina"
  texto_base: "Repita el uroanálisis con orina de la mañana, sin ejercicio intenso ni relaciones sexuales las 48 horas antes, y fuera de la menstruación."
  meta_concreta: "Programe el examen para un día que cumpla esas condiciones en las próximas 4 semanas."
  por_que: "El ejercicio, una infección o la menstruación pueden alterar el examen; repetirlo en buenas condiciones lo aclara."
  se_activa_con: ["COND-M2-NE-006", "COND-M2-NE-002"]
  prioriza_objetivos: ["prevenir", "salud_general"]
  contraindicada_si: []
  requiere_consulta_previa: false
  whatsapp: "🧪 Recuerde repetir su examen de orina: con la primera orina de la mañana y sin ejercicio fuerte los 2 días antes."
  fuentes: ["AUA/SUFU Guideline on Microhematuria 2020", "KDIGO 2024 Clinical Practice Guideline for CKD"]

- id: REC-CTL-108
  tipo: controles
  titulo: "Repita los exámenes de tiroides"
  texto_base: "Repita la TSH y la T4 libre en la mañana, como indique su médico, y cuéntele si tuvo alguna enfermedad reciente o usa medicamentos o suplementos."
  meta_concreta: "Pida su cita en las próximas 4 semanas."
  por_que: "Los resultados de tiroides cambian con enfermedades recientes y algunos medicamentos; repetirlos confirma el hallazgo."
  se_activa_con: ["COND-M2-TI-001", "COND-M2-TI-003", "COND-M2-TI-004", "REL-017"]
  prioriza_objetivos: ["energia_sueno", "condicion_existente", "bajar_peso"]
  contraindicada_si: []
  requiere_consulta_previa: false
  whatsapp: "📅 Le recordamos pedir su cita para repetir sus exámenes de tiroides en la mañana."
  fuentes: ["ATA Guidelines for the Treatment of Hypothyroidism 2014", "ATA Guidelines for Hyperthyroidism 2016"]

- id: REC-CTL-109
  tipo: controles
  titulo: "Cita con endocrinología"
  texto_base: "Pida una cita con endocrinología para revisar estos resultados de tiroides y hormonas. Lleve este informe y su lista de medicamentos."
  meta_concreta: "Solicite la cita esta semana a través de su EPS o prepagada."
  por_que: "Este patrón necesita la mirada de un especialista en hormonas para decidir qué estudiar."
  se_activa_con: ["COND-M2-TI-003", "COND-M2-TI-005"]
  prioriza_objetivos: ["condicion_existente", "salud_general"]
  contraindicada_si: []
  requiere_consulta_previa: false
  whatsapp: "📅 Le recordamos solicitar su cita con endocrinología esta semana. Lleve su informe de Saludly."
  fuentes: ["ATA Guidelines for the Treatment of Hypothyroidism 2014", "ATA Guidelines for Hyperthyroidism 2016"]

- id: REC-CTL-110
  tipo: controles
  titulo: "Repita el calcio y la PTH"
  texto_base: "Repita el calcio y la hormona paratiroidea como indique su médico. Cuéntele si usa suplementos de calcio o de vitamina D, o diuréticos."
  meta_concreta: "Pida su cita en las próximas 4 semanas."
  por_que: "Algunos suplementos y medicamentos suben el calcio; repetir el examen con esa información lo aclara."
  se_activa_con: ["COND-M2-TI-007", "calcium:alto"]
  prioriza_objetivos: ["condicion_existente", "envejecer_saludable"]
  contraindicada_si: []
  requiere_consulta_previa: false
  whatsapp: "📋 Recuerde pedir su cita para repetir sus exámenes de calcio. Lleve la lista de suplementos y medicamentos que usa."
  fuentes: ["Fifth International Workshop on Primary Hyperparathyroidism 2022"]

- id: REC-CTL-111
  tipo: controles
  titulo: "Consulta médica en los próximos días"
  texto_base: "Pida una cita médica en los próximos días para revisar este resultado. Si tiene vómito, mareo intenso o desmayo, vaya a urgencias de inmediato."
  meta_concreta: "Pida la cita en los próximos 3 días."
  por_que: "Este resultado necesita confirmación pronto, y esos síntomas indican que hay que actuar sin esperar."
  se_activa_con: ["COND-M2-TI-009", "SEG-002"]
  prioriza_objetivos: ["condicion_existente", "salud_general", "energia_sueno"]
  contraindicada_si: []
  requiere_consulta_previa: false
  whatsapp: "📅 Le recordamos pedir su cita médica en los próximos días. Si siente vómito, mareo fuerte o desmayo, vaya a urgencias."
  fuentes: ["Endocrine Society, Diagnosis and Treatment of Primary Adrenal Insufficiency 2016"]

- id: REC-CTL-112
  tipo: controles
  titulo: "Complete el estudio de la presión"
  texto_base: "Pida una cita médica para completar el estudio de su presión con estos resultados hormonales. Lleve la lista de sus medicamentos para la presión."
  meta_concreta: "Pida la cita en las próximas 2 semanas."
  por_que: "Algunos medicamentos cambian estas hormonas, y su médico decide cómo interpretar el resultado."
  se_activa_con: ["COND-M2-TI-008"]
  prioriza_objetivos: ["condicion_existente", "prevenir"]
  contraindicada_si: []
  requiere_consulta_previa: false
  whatsapp: "📅 Le recordamos pedir su cita para revisar sus resultados junto con sus medicamentos de la presión."
  fuentes: ["Endocrine Society, Management of Primary Aldosteronism 2016", "GPC Colombia HTA 2025 (Minsalud e IETS)"]

- id: REC-CTL-113
  tipo: controles
  titulo: "Que su familia revise su colesterol"
  texto_base: "Invite a sus padres, hermanos e hijos a hacerse un perfil de lípidos. Algunos resultados del colesterol se comparten en la familia."
  meta_concreta: "Esta semana, cuénteles a sus familiares cercanos y sugiérales el examen."
  por_que: "Detectarlo a tiempo en la familia permite que cada persona se cuide desde antes."
  se_activa_con: ["COND-M1-CA-002", "COND-M1-CA-004"]
  prioriza_objetivos: ["prevenir", "salud_general", "envejecer_saludable"]
  contraindicada_si: []
  requiere_consulta_previa: false
  whatsapp: "👨‍👩‍👧 Esta semana cuénteles a sus padres, hermanos o hijos que vale la pena revisar su colesterol con un examen de sangre."
  fuentes: ["2018 AHA/ACC Guideline on the Management of Blood Cholesterol", "EAS Consensus Statement on Lipoprotein(a) 2022"]

- id: REC-CTL-114
  tipo: controles
  titulo: "Defina sus metas de colesterol"
  texto_base: "Pida una consulta para que su médico defina con usted cuál debe ser su meta de colesterol según su riesgo y si necesita algo más que cambios de hábitos."
  meta_concreta: "Pida la cita en el próximo mes."
  por_que: "La meta de colesterol depende de su riesgo completo; su médico la ajusta a usted."
  se_activa_con: ["COND-M1-CA-001", "COND-M1-CA-002", "COND-M1-CA-004", "COND-M1-CA-005", "REL-003"]
  prioriza_objetivos: ["prevenir", "condicion_existente", "envejecer_saludable"]
  contraindicada_si: []
  requiere_consulta_previa: false
  whatsapp: "📅 Le recordamos pedir su cita para definir con su médico su meta de colesterol."
  fuentes: ["2018 AHA/ACC Guideline on the Management of Blood Cholesterol", "2019 ACC/AHA Guideline on the Primary Prevention of Cardiovascular Disease"]

- id: REC-CTL-115
  tipo: controles
  titulo: "Repita los triglicéridos en buenas condiciones"
  texto_base: "Repita el perfil de lípidos con 8 a 12 horas de ayuno y sin alcohol las 48 horas antes."
  meta_concreta: "Programe el examen en las próximas 6 semanas y marque los dos días previos sin alcohol."
  por_que: "Los triglicéridos suben con la comida y el alcohol recientes; medirlos bien da un valor confiable."
  se_activa_con: ["COND-M1-CA-003"]
  prioriza_objetivos: ["prevenir", "bajar_peso", "salud_general"]
  contraindicada_si: []
  requiere_consulta_previa: false
  whatsapp: "🧪 Para su próximo examen de lípidos: vaya en ayunas y sin alcohol los 2 días antes. Así el resultado es más confiable."
  fuentes: ["2018 AHA/ACC Guideline on the Management of Blood Cholesterol"]

- id: REC-CTL-116
  tipo: controles
  titulo: "Revise la glucosa baja con su médico"
  texto_base: "Comente este resultado con su médico para repetirlo. Si siente temblor, sudor frío, confusión o mareo, coma algo con azúcar y busque atención."
  meta_concreta: "Pida su cita en las próximas 4 semanas."
  por_que: "La glucosa baja en un examen puede ser por la muestra o por el ayuno; repetirlo aclara."
  se_activa_con: ["COND-M1-EM-005"]
  prioriza_objetivos: ["energia_sueno", "condicion_existente", "salud_general"]
  contraindicada_si: []
  requiere_consulta_previa: false
  whatsapp: "📅 Recuerde pedir su cita para revisar su glucosa. Si siente temblor, sudor frío o mareo, coma algo dulce y busque atención."
  fuentes: ["Endocrine Society, Evaluation and Management of Adult Hypoglycemic Disorders 2009"]

- id: REC-CTL-117
  tipo: controles
  titulo: "Cita con ginecología"
  texto_base: "Pida una cita con ginecología o medicina general para revisar estos resultados hormonales junto con su ciclo menstrual."
  meta_concreta: "Anote las fechas de sus últimos 3 ciclos y pida la cita en el próximo mes."
  por_que: "Estas hormonas se interpretan mejor con la historia de su ciclo y un examen médico."
  se_activa_con: ["COND-M5-MU-001", "REL-028"]
  prioriza_objetivos: ["condicion_existente", "salud_general", "bajar_peso"]
  contraindicada_si: []
  requiere_consulta_previa: false
  whatsapp: "🗓️ Anote las fechas de sus últimas menstruaciones y pida su cita con ginecología. Esa información ayuda mucho en la consulta."
  fuentes: ["International Evidence-based Guideline for the Assessment and Management of PCOS 2023"]

- id: REC-CTL-118
  tipo: controles
  titulo: "Repita la FSH y consulte"
  texto_base: "Repita la FSH en 4 a 6 semanas, como indique su médico, y pida una cita para revisarla junto con su ciclo menstrual."
  meta_concreta: "Marque en su calendario la fecha para repetir el examen en 4 a 6 semanas."
  por_que: "Esta hormona cambia según el día del ciclo; repetirla confirma si el hallazgo se mantiene."
  se_activa_con: ["COND-M5-MU-002"]
  prioriza_objetivos: ["condicion_existente", "salud_general"]
  contraindicada_si: []
  requiere_consulta_previa: false
  whatsapp: "📅 Ponga en su calendario la fecha para repetir su examen hormonal en 4 a 6 semanas y pida su cita médica."
  fuentes: ["ESHRE Guideline: Management of Premature Ovarian Insufficiency 2024"]

- id: REC-CTL-119
  tipo: controles
  titulo: "Repita la prolactina en reposo"
  texto_base: "Repita la prolactina en la mañana, después de unos minutos de reposo y sin estrés ni ejercicio antes. Lleve la lista de sus medicamentos."
  meta_concreta: "Pida su cita en las próximas 4 semanas con la lista de medicamentos."
  por_que: "La prolactina sube con el estrés, el ejercicio y algunos medicamentos; medirla en reposo da un valor más confiable."
  se_activa_con: ["COND-M5-MU-003", "REL-027"]
  prioriza_objetivos: ["condicion_existente", "salud_general"]
  contraindicada_si: []
  requiere_consulta_previa: false
  whatsapp: "🧪 Recuerde repetir su examen hormonal en la mañana y en calma. Lleve la lista de los medicamentos que usa."
  fuentes: ["Endocrine Society, Diagnosis and Treatment of Hyperprolactinemia 2011"]

- id: REC-CTL-120
  tipo: controles
  titulo: "Prepárese bien para repetir el PSA"
  texto_base: "Consulte con su médico para revisar este resultado. Antes de repetir el PSA, evite la eyaculación y montar bicicleta las 48 horas previas."
  meta_concreta: "Pida su cita en las próximas 4 semanas."
  por_que: "El PSA puede subir por la bicicleta, la eyaculación o una inflamación; prepararse bien hace el resultado más confiable."
  se_activa_con: ["COND-M5-UR-001"]
  prioriza_objetivos: ["prevenir", "condicion_existente", "envejecer_saludable"]
  contraindicada_si: []
  requiere_consulta_previa: false
  whatsapp: "📅 Le recordamos pedir su cita médica. Antes de repetir su examen, evite montar bicicleta y la eyaculación los 2 días previos."
  fuentes: ["AUA/SUO Guideline: Early Detection of Prostate Cancer 2023"]

- id: REC-CTL-121
  tipo: controles
  titulo: "Repita la testosterona en la mañana"
  texto_base: "Repita la testosterona antes de las 10 de la mañana, en ayunas y después de una buena noche de sueño, y revise el resultado con su médico."
  meta_concreta: "Pida su cita y programe el examen en la mañana en las próximas 4 semanas."
  por_que: "La testosterona es más alta temprano y baja con el mal sueño o una enfermedad reciente; repetirla bien confirma el hallazgo."
  se_activa_con: ["COND-M5-UR-002", "REL-024"]
  prioriza_objetivos: ["masa_muscular", "energia_sueno", "condicion_existente"]
  contraindicada_si: []
  requiere_consulta_previa: false
  whatsapp: "🌅 Para repetir su examen hormonal: vaya antes de las 10 de la mañana, en ayunas y después de dormir bien."
  fuentes: ["Endocrine Society, Testosterone Therapy in Men with Hypogonadism 2018"]

- id: REC-CTL-122
  tipo: controles
  titulo: "Controle presión y lípidos cada año"
  texto_base: "En esta etapa conviene medir la presión y el perfil de lípidos al menos una vez al año, y hablar con su médico sobre la salud de sus huesos."
  meta_concreta: "Marque en su calendario su próximo control anual."
  por_que: "Con los cambios hormonales de esta etapa cambian el colesterol, la presión y los huesos."
  se_activa_con: ["COND-M5-MU-004"]
  prioriza_objetivos: ["envejecer_saludable", "prevenir", "salud_general"]
  contraindicada_si: []
  requiere_consulta_previa: false
  whatsapp: "📅 Ponga hoy en su calendario la fecha de su próximo control anual de presión y colesterol."
  fuentes: ["The 2022 Hormone Therapy Position Statement of The North American Menopause Society", "ACOG Clinical Practice Guideline: Management of Postmenopausal Osteoporosis 2022"]

- id: REC-CTL-123
  tipo: controles
  titulo: "Avise en su control prenatal"
  texto_base: "Lleve este resultado de tiroides a su próximo control prenatal para que su médico lo revise pronto."
  meta_concreta: "Comuníquese con su control prenatal esta semana."
  por_que: "En el embarazo la tiroides cambia y su control es importante; su equipo prenatal decide qué hacer."
  se_activa_con: ["COND-M2-TI-006"]
  prioriza_objetivos: ["condicion_existente", "salud_general"]
  contraindicada_si: []
  requiere_consulta_previa: false
  whatsapp: "🤰 Le recordamos comunicarse esta semana con su control prenatal para revisar sus resultados."
  fuentes: ["ATA Guidelines for Thyroid Disease During Pregnancy and the Postpartum 2017"]

- id: REC-CTL-124
  tipo: controles
  titulo: "Lleve su lista de medicamentos"
  texto_base: "Haga una lista de todos los medicamentos, suplementos y productos naturales que usa, con su frecuencia, y llévela a su próxima cita."
  meta_concreta: "Haga la lista esta semana y guárdela en el celular."
  por_que: "Varios medicamentos cambian estos resultados; con la lista, su médico los interpreta mejor."
  se_activa_con: ["COND-M2-NE-004", "COND-M2-NE-005", "COND-M2-TI-001", "COND-M2-TI-008", "COND-M5-MU-003", "COND-M5-UR-002", "REL-027", "COND-M2-TI-009", "COND-M5-UR-001", "COND-M2-TI-006"]
  prioriza_objetivos: ["condicion_existente", "salud_general"]
  contraindicada_si: []
  requiere_consulta_previa: false
  whatsapp: "📋 Esta semana haga en el celular la lista de medicamentos y suplementos que usa. Le va a servir en su próxima cita."
  fuentes: ["Endocrine Society, Diagnosis and Treatment of Hyperprolactinemia 2011", "Guía europea de hiponatremia 2014 (Spasovski et al.)"]

- id: REC-CTL-125
  tipo: controles
  titulo: "Mida su cintura cada mes"
  texto_base: "Mida su cintura a la altura del ombligo, en la mañana y sin apretar el metro, una vez al mes, y anote el valor."
  meta_concreta: "Mida su cintura este fin de semana y ponga un recordatorio mensual."
  por_que: "La cintura muestra la grasa del abdomen, que es la que más se relaciona con el azúcar y el corazón."
  se_activa_con: ["COND-M1-EM-003", "COND-M1-EM-004", "objetivo:bajar_peso"]
  prioriza_objetivos: ["bajar_peso", "prevenir", "salud_general"]
  contraindicada_si: []
  requiere_consulta_previa: false
  whatsapp: "📏 Este fin de semana mida su cintura a la altura del ombligo y anótela. Repita cada mes para ver su avance."
  fuentes: ["IDF Consensus Worldwide Definition of the Metabolic Syndrome 2006", "2013 AHA/ACC/TOS Guideline for the Management of Overweight and Obesity in Adults"]

- id: REC-CTL-126
  tipo: controles
  titulo: "Sus controles preventivos al día"
