  titulo: "Repita el hemograma en unas semanas"
  texto_base: "Pídale a su médico repetir el hemograma en 4 a 6 semanas. Si en estos días tuvo gripa u otra infección, cuénteselo."
  meta_concreta: "Agende el nuevo hemograma para dentro de 4 a 6 semanas."
  por_que: "Una infección reciente, el ejercicio o el hierro bajo pueden mover estos valores por un tiempo; repetirlo muestra si el cambio se mantiene."
