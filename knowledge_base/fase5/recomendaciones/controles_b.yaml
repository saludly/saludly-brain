  titulo: "Repita la CK sin haber entrenado fuerte"
  texto_base: "Pídale a su médico repetir la CK, la enzima de los músculos, después de dos días sin ejercicio intenso. Cuéntele si usa medicamentos para el colesterol."
  meta_concreta: "Agende el control en las próximas 2 a 4 semanas, con 48 horas de descanso de ejercicio intenso antes."
  por_que: "La CK sube mucho con el ejercicio reciente; repetirla en reposo muestra si el valor se mantiene."
