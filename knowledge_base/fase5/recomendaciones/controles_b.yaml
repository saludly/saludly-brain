  meta_concreta: "Durante el próximo mes, anote si aparece alguno de estos síntomas y, si aparece, pida cita esa misma semana."
  por_que: "Estos síntomas pueden indicar que la sangre está más espesa de lo conveniente y el médico debe revisarlo antes."
  se_activa_con: ["COND-M3-HE-007"]
