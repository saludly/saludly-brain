- id: REC-CTL-219
  tipo: controles
  titulo: "Orina oscura o dolor muscular fuerte: a urgencias"
  texto_base: "Si nota la orina oscura, de color café oscuro, o un dolor o debilidad muscular fuerte, vaya a urgencias ese mismo día."
  meta_concreta: "Durante los próximos días, revise el color de su orina después de entrenar."
  por_que: "Cuando el músculo se daña mucho, libera sustancias que pueden afectar los riñones, y eso se atiende rápido."
  se_activa_con: ["SEG-007"]
  prioriza_objetivos: ["rendimiento", "atletico", "maraton", "masa_muscular"]
  contraindicada_si: []
  requiere_consulta_previa: false
