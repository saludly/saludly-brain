# Recomendaciones de vitaminas y suplementos (regla de vitaminas, documento 07.3). Alimentos primero; el suplemento
# solo como opción general para hablar con el médico. Sin dosis ni marcas. Numeración 200 a 299.

- id: REC-VIT-201
  tipo: vitaminas_suplementos
  titulo: "Habla con tu médico antes de suplementar vitamina D"
  texto_base: "Primero suma alimentos con vitamina D y sol prudente. Si quieres usar un suplemento, consúltalo con tu médico: él decide si lo necesitas y cómo usarlo."
  meta_concreta: "En tu próxima consulta, pregunta a tu médico si en tu caso conviene un suplemento de vitamina D."
  por_que: "La vitamina D ayuda a los huesos y los músculos; en exceso también puede hacer daño, por eso se decide con el médico."
  se_activa_con: ["vitamin_d:bajo", "COND-M3-NU-A03", "REL-020"]
  prioriza_objetivos: ["masa_muscular", "envejecer_saludable", "atletico", "energia_sueno"]
  contraindicada_si: ["vitamin_d:alto"]
  requiere_consulta_previa: false
  whatsapp: "Si estás pensando en tomar vitaminas, anota la pregunta para tu próxima cita: tu médico te dirá si las necesitas y cómo usarlas."
  fuentes: ["Endocrine Society 2024, vitamina D para la prevención de enfermedades"]

- id: REC-VIT-202
  tipo: vitaminas_suplementos
  titulo: "Revisa con tu médico los suplementos con vitamina D"
  texto_base: "Haz una lista de todos los suplementos, multivitamínicos y productos naturales que usas y revísala con tu médico, porque varios traen vitamina D."
  meta_concreta: "Esta semana, escribe la lista de suplementos que usas y llévala a tu próxima cita."
  por_que: "La vitamina D alta casi siempre viene de suplementos y puede subir el calcio."
  se_activa_con: ["vitamin_d:alto"]
  prioriza_objetivos: ["salud_general", "condicion_existente", "envejecer_saludable"]
  contraindicada_si: []
  requiere_consulta_previa: false
  whatsapp: "Tarea de la semana: toma foto a las etiquetas de las vitaminas y suplementos que usas y llévalas a tu próxima cita médica."
  fuentes: ["Endocrine Society 2024, vitamina D para la prevención de enfermedades", "Regla de vitaminas, documento 07.3"]

- id: REC-VIT-203
  tipo: vitaminas_suplementos
  titulo: "Conversa con tu médico sobre la vitamina B12"
  texto_base: "Además de los alimentos, pregunta a tu médico si necesitas reponer la vitamina B12 y de qué forma. Es especialmente importante si no comes productos animales, si usas metformina o medicamentos para la acidez."
  meta_concreta: "Pide una cita en el próximo mes y lleva la lista de tus medicamentos."
  por_que: "Algunas personas no absorben bien la B12 de la comida y necesitan otra forma de reponerla, que define el médico."
  se_activa_con: ["COND-M3-NU-001", "COND-M3-HE-004", "REL-015", "vitamin_b12:bajo"]
  prioriza_objetivos: ["energia_sueno", "envejecer_saludable", "condicion_existente"]
  contraindicada_si: []
  requiere_consulta_previa: false
  whatsapp: "Recordatorio: agenda tu cita médica de este mes y lleva la lista de los medicamentos que usas, incluidos los de la acidez."
  fuentes: ["NICE NG239 2024, déficit de vitamina B12", "BSH 2014, diagnóstico y tratamiento de los trastornos de cobalamina y folato"]

- id: REC-VIT-204
  tipo: vitaminas_suplementos
  titulo: "Si buscas un embarazo, pregunta por el ácido fólico"
  texto_base: "Si estás buscando un embarazo o podrías quedar embarazada, habla pronto con tu médico sobre el ácido fólico. Fuera de ese caso, prioriza los alimentos con folato."
  meta_concreta: "Si planeas un embarazo, pide la cita de control preconcepcional este mes."
  por_que: "El folato es clave en las primeras semanas del embarazo, incluso antes de saber que estás embarazada."
  se_activa_con: ["COND-M3-NU-002", "folate:bajo", "REL-015"]
  prioriza_objetivos: ["prevenir", "salud_general", "condicion_existente"]
  contraindicada_si: []
  requiere_consulta_previa: false
  whatsapp: "Si estás pensando en un embarazo, este es buen momento para una cita de control con tu médico. Planear con tiempo hace la diferencia."
  fuentes: ["OMS, suplementación con ácido fólico antes de la concepción", "OMS, folato en la nutrición humana"]

- id: REC-VIT-205
  tipo: vitaminas_suplementos
  titulo: "Hierro solo con indicación médica"
  texto_base: "No empieces suplementos de hierro ni multivitamínicos con hierro por tu cuenta. Si tu médico te lo formula, sigue su indicación y pregúntale cuándo repetir el control."
  meta_concreta: "Antes de comprar cualquier vitamina, revisa con tu médico si trae hierro."
  por_que: "El hierro de más se acumula en el cuerpo; y si falta, primero hay que saber por qué."
  se_activa_con: ["COND-M3-HE-002", "COND-M3-HE-003", "REL-013", "REL-014", "COND-M3-HE-006", "COND-M3-HE-A04"]
  prioriza_objetivos: ["maraton", "rendimiento", "energia_sueno", "condicion_existente"]
  contraindicada_si: []
  requiere_consulta_previa: false
  whatsapp: "Antes de comprar vitaminas en la droguería, pregúntale a tu médico si te convienen. No todas sirven para todos."
  fuentes: ["BSG 2021, guía de anemia por déficit de hierro en adultos", "EASL 2022, guía de hemocromatosis", "BSH, tamizaje de hemoglobinopatías"]

- id: REC-VIT-206
  tipo: vitaminas_suplementos
  titulo: "Sin suplementos de hierro ni de vitamina C por ahora"
  texto_base: "Hasta hablar con tu médico, no uses suplementos de hierro, de vitamina C ni multivitamínicos que los contengan. Las frutas sí las puedes comer normalmente."
  meta_concreta: "Esta semana, revisa las etiquetas de tus suplementos y aparta los que traen hierro o vitamina C hasta la consulta."
  por_que: "La vitamina C en suplemento aumenta la absorción de hierro, y por ahora conviene no sumar más."
  se_activa_con: ["COND-M3-HE-006"]
  prioriza_objetivos: ["prevenir", "condicion_existente", "salud_general"]
  contraindicada_si: []
  requiere_consulta_previa: false
  whatsapp: "Esta semana revisa las etiquetas de las vitaminas que tienes en casa y llévalas a tu próxima cita médica para revisarlas juntos."
  fuentes: ["EASL 2022, guía de hemocromatosis"]

- id: REC-VIT-207
  tipo: vitaminas_suplementos
  titulo: "Magnesio: alimentos primero y suplemento solo con tu médico"
  texto_base: "Prioriza los alimentos con magnesio. Si quieres un suplemento, consúltalo antes con tu médico y cuéntale si usas diuréticos o medicamentos para la acidez, que pueden bajarlo."
  meta_concreta: "En tu próxima cita, revisa con tu médico tus medicamentos y si conviene un suplemento."
  por_que: "Algunos medicamentos bajan el magnesio, y el suplemento no le sirve a todo el mundo, sobre todo si los riñones filtran menos."
  se_activa_con: ["magnesium:bajo", "SEG-008"]
  prioriza_objetivos: ["rendimiento", "maraton", "energia_sueno"]
  contraindicada_si: ["COND-M2-NE-001", "magnesium:alto"]
  requiere_consulta_previa: false
  whatsapp: "Si usas medicamentos para la acidez o para orinar más, anótalo para tu próxima cita médica. Tu médico revisará si afectan tus minerales."
  fuentes: ["NIH ODS, ficha de magnesio para profesionales"]

- id: REC-VIT-208
  tipo: vitaminas_suplementos
  titulo: "Zinc: alimentos primero"
  texto_base: "Cubre el zinc con la comida. Si estás pensando en un suplemento, háblalo antes con tu médico, porque el zinc de más puede bajar el cobre."
  meta_concreta: "Durante un mes, una fuente de zinc al día en tus comidas y ningún suplemento sin hablar con tu médico."
  por_que: "La comida variada suele bastar, y el exceso de zinc en suplemento altera otros minerales."
  se_activa_con: ["zinc:bajo", "SEG-014"]
  prioriza_objetivos: ["salud_general", "atletico", "envejecer_saludable"]
  contraindicada_si: []
  requiere_consulta_previa: false
  whatsapp: "Recuerda: la mejor fuente de minerales es tu plato. Si piensas en suplementos, consúltalo primero con tu médico."
  fuentes: ["NIH ODS, ficha de zinc para profesionales"]

- id: REC-VIT-209
  tipo: vitaminas_suplementos
  titulo: "Lleva a la cita tus suplementos y productos naturales"
  texto_base: "Muestra a tu médico todos los suplementos, productos naturales, tés adelgazantes y medicamentos que usas, incluso los que compras sin fórmula."
  meta_concreta: "Antes de tu próxima cita, haz la lista completa con nombre de cada producto y desde cuándo lo usas."
  por_que: "Varios productos naturales y suplementos pueden alterar las pruebas del hígado."
  se_activa_con: ["COND-M4-GA-002", "COND-M4-GA-003", "REL-006"]
  prioriza_objetivos: ["condicion_existente", "prevenir", "bajar_peso"]
  contraindicada_si: []
  requiere_consulta_previa: false
  whatsapp: "Tarea sencilla: junta en una bolsa los suplementos y productos naturales que usas y llévalos a tu próxima cita médica."
  fuentes: ["ACG 2017, evaluación de pruebas hepáticas alteradas"]

- id: REC-VIT-210
  tipo: vitaminas_suplementos
  titulo: "Pregunta por la biotina antes de tu próximo examen"
  texto_base: "Si usas biotina o un producto para el pelo, la piel o las uñas, pregunta a tu médico si debes dejarla unos días antes de repetir tus exámenes."
  meta_concreta: "Antes de tu próximo examen de sangre, confirma con tu médico cuántos días antes dejar la biotina."
  por_que: "La biotina altera varios exámenes de laboratorio, como los de tiroides y algunas vitaminas, y puede dar resultados engañosos."
  se_activa_con: ["biotin:alto"]
  prioriza_objetivos: ["salud_general", "condicion_existente"]
  contraindicada_si: []
  requiere_consulta_previa: false
  whatsapp: "Antes de tu próximo examen de sangre, cuéntale al laboratorio y a tu médico si usas productos para el pelo, la piel o las uñas."
  fuentes: ["FDA 2019, comunicación de seguridad sobre interferencia de la biotina en pruebas de laboratorio"]

- id: REC-VIT-211
  tipo: vitaminas_suplementos
  titulo: "Revisa con tu médico las vitaminas A o E"
  texto_base: "Si usas suplementos o multivitamínicos, llévalos a una consulta médica para revisar si traen vitamina A o E y si debes seguir con ellos."
  meta_concreta: "Agenda una cita en el próximo mes y lleva las etiquetas de tus suplementos."
  por_que: "Las vitaminas A y E se acumulan en el cuerpo y en exceso pueden afectar el hígado o la coagulación."
  se_activa_con: ["vitamin_a:alto", "vitamin_e:alto"]
  prioriza_objetivos: ["salud_general", "envejecer_saludable", "condicion_existente"]
  contraindicada_si: []
  requiere_consulta_previa: false
  whatsapp: "Este mes, aprovecha tu cita médica para revisar las vitaminas que usas. Lleva las etiquetas."
  fuentes: ["NIH ODS, fichas de vitamina A y vitamina E para profesionales", "Regla de vitaminas, documento 07.3"]
