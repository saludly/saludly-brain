# Recomendaciones de vitaminas y suplementos · lote A
# Numeración 100 a 199. Regla de vitaminas (documento 07.3): alimentos primero; suplementos solo como tema para
# hablar con el médico, sin dosis ni marcas. Pendiente de revisión de Carlos.
# 20 de octubre de 2026: textos pasados a "usted" con emoji en WhatsApp; aprobado por Carlos el 20 de octubre de 2026.

- id: REC-VIT-101
  tipo: vitaminas_suplementos
  titulo: "Cuéntele a su médico si usa biotina"
  texto_base: "Si usa suplementos para el pelo, la piel o las uñas, o multivitamínicos, revise si tienen biotina y coménteselo a su médico antes de repetir los exámenes de tiroides."
  meta_concreta: "Revise hoy las etiquetas de sus suplementos y anote si alguno dice biotina."
  por_que: "La biotina puede alterar el resultado de los exámenes de tiroides y hacerlos parecer distintos de lo que son."
  se_activa_con: ["COND-M2-TI-001", "COND-M2-TI-002", "COND-M2-TI-003", "COND-M2-TI-004", "COND-M2-TI-005", "REL-017", "biotin:alto"]
  prioriza_objetivos: ["condicion_existente", "energia_sueno", "salud_general"]
  contraindicada_si: []
  requiere_consulta_previa: false
  whatsapp: "🔎 Revise hoy las etiquetas de sus suplementos para pelo, piel o uñas. Si alguno dice biotina, coménteselo a su médico antes de repetir sus exámenes."
  fuentes: ["FDA Safety Communication: Biotin interference with laboratory tests 2019", "ATA Guidelines for the Treatment of Hypothyroidism 2014"]

- id: REC-VIT-102
  tipo: vitaminas_suplementos
  titulo: "Sin suplementos de potasio por su cuenta"
  texto_base: "No use suplementos de potasio, sales minerales ni productos naturales con potasio sin indicación médica, hasta repetir el examen."
  meta_concreta: "Revise hoy sus suplementos y separe los que digan potasio para mostrárselos a su médico."
  por_que: "Sumar potasio cuando ya está alto puede afectar el ritmo del corazón."
  se_activa_con: ["COND-M2-NE-004", "potassium:alto"]
  prioriza_objetivos: ["condicion_existente", "salud_general"]
  contraindicada_si: []
  requiere_consulta_previa: false
  whatsapp: "🔎 Si usa suplementos o sales minerales, revise si tienen potasio y muéstreselos a su médico antes de seguir usándolos."
  fuentes: ["KDIGO Controversies Conference on Potassium 2020"]

- id: REC-VIT-103
  tipo: vitaminas_suplementos
  titulo: "Calcio y vitamina D solo con indicación"
  texto_base: "Mientras se aclara el resultado, no use suplementos de calcio ni de vitamina D sin indicación de su médico, y cuéntele si ya los usaba."
  meta_concreta: "Anote hoy qué suplementos usa para llevarlos a su cita."
  por_que: "Estos suplementos pueden subir el calcio de la sangre y confundir el resultado."
  se_activa_con: ["COND-M2-TI-007", "calcium:alto"]
  prioriza_objetivos: ["condicion_existente", "envejecer_saludable"]
  contraindicada_si: []
  requiere_consulta_previa: false
  whatsapp: "📋 Antes de su cita, anote los suplementos que usa, en especial si tienen calcio o vitamina D, y llévele la lista a su médico."
  fuentes: ["Fifth International Workshop on Primary Hyperparathyroidism 2022"]

- id: REC-VIT-104
  tipo: vitaminas_suplementos
  titulo: "Sin yodo ni algas extra"
  texto_base: "No use suplementos de yodo, algas ni productos para la tiroides sin indicación de su médico. La sal yodada de la cocina es suficiente."
  meta_concreta: "Revise hoy si algún suplemento o té que usa tiene yodo o algas y coménteselo en su cita."
  por_que: "El exceso de yodo puede desajustar la tiroides en cualquier dirección."
  se_activa_con: ["COND-M2-TI-001", "COND-M2-TI-002", "COND-M2-TI-004", "COND-M2-TI-005", "REL-017"]
  prioriza_objetivos: ["condicion_existente", "energia_sueno", "bajar_peso"]
  contraindicada_si: []
  requiere_consulta_previa: false
  whatsapp: "🔎 Si usa productos naturales para la tiroides o con algas, coménteselo a su médico antes de seguir usándolos."
  fuentes: ["ATA Guidelines for the Treatment of Hypothyroidism 2014", "ATA Statement on the Potential Risks of Excess Iodine Ingestion 2013"]

- id: REC-VIT-105
  tipo: vitaminas_suplementos
  titulo: "Proteína en polvo y creatina, mejor consultar"
  texto_base: "Si quiere usar proteína en polvo o creatina, hable primero con su médico. Mientras se revisan sus riñones, la comida es la mejor fuente."
  meta_concreta: "Lleve a su cita los suplementos deportivos que usa o quiere usar."
  por_que: "La creatina y el exceso de proteína pueden cambiar los exámenes del riñón y su cuidado."
  se_activa_con: ["COND-M2-NE-001", "COND-M2-NE-002", "COND-M2-NE-003", "REL-010"]
  prioriza_objetivos: ["masa_muscular", "atletico", "condicion_existente"]
  contraindicada_si: []
  requiere_consulta_previa: true
  whatsapp: "🩺 Si usa o quiere usar proteína en polvo o creatina, coménteselo primero a su médico."
  fuentes: ["KDIGO 2024 Clinical Practice Guideline for CKD"]

- id: REC-VIT-106
  tipo: vitaminas_suplementos
  titulo: "Cuidado con los productos para la testosterona"
  texto_base: "No use productos que prometen subir la testosterona o la masa muscular sin hablar antes con su médico. Algunos tienen hormonas no declaradas."
  meta_concreta: "Si usa alguno, llévelo a su próxima cita."
  por_que: "Estos productos pueden alterar sus hormonas y sus exámenes sin control médico."
  se_activa_con: ["COND-M5-UR-002", "REL-024"]
  prioriza_objetivos: ["masa_muscular", "atletico", "energia_sueno"]
  contraindicada_si: []
  requiere_consulta_previa: false
  whatsapp: "⚠️ Si usa productos para subir la testosterona o el músculo, muéstreselos a su médico antes de seguir."
  fuentes: ["Endocrine Society, Testosterone Therapy in Men with Hypogonadism 2018", "INVIMA, alertas sanitarias sobre suplementos dietarios"]

- id: REC-VIT-107
  tipo: vitaminas_suplementos
  titulo: "Si quiere suplementar, hable con su médico"
  texto_base: "Primero busque el calcio y la vitamina D en los alimentos. Si quiere suplementar, hable con su médico para saber si lo necesita."
  meta_concreta: "Lleve la pregunta a su próxima cita."
  por_que: "Su médico decide si le conviene un suplemento según sus exámenes y sus huesos."
  se_activa_con: ["COND-M5-MU-004"]
  prioriza_objetivos: ["envejecer_saludable", "prevenir"]
  contraindicada_si: ["COND-M2-TI-007", "calcium:alto"]
  requiere_consulta_previa: false
  whatsapp: "🦴 ¿Se pregunta si necesita calcio o vitamina D? Anote la pregunta para su próxima cita médica."
  fuentes: ["The Menopause Society (NAMS), Management of osteoporosis in postmenopausal women 2021"]
