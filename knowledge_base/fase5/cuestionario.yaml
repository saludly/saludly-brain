# Cuestionario que el paciente responde en la PWA antes de la visita (Fase 6, 20 de octubre de 2026).
# Los objetivos salen de objetivos.yaml y las alergias, la dieta y los medicamentos de filtros.yaml.
# La enfermera solo llena lo técnico (presión, cintura, cadera, peso y talla medidos).
# codigo/herramientas/exportar_app.py lo pasa a la app (app/src/lib/contenido.json).
# estado_revision: propuesta (las preguntas no cambian umbrales; alimentan el contexto del motor)

actividad:
  texto: "¿Cuánto se mueve en una semana normal?"
  opciones:
    - {id: sedentario, texto: "Casi no me muevo"}
    - {id: ligero, texto: "Camino o hago algo de ejercicio 1 o 2 veces por semana"}
    - {id: moderado, texto: "Hago ejercicio 3 o 4 veces por semana"}
    - {id: alto, texto: "Entreno 5 veces o más por semana"}

biotina:
  texto: "¿Toma biotina o algún suplemento para el pelo, la piel o las uñas?"
  ayuda: "La biotina puede cambiar algunos resultados del laboratorio, como los de tiroides."

fuma:
  texto: "¿Fuma o vapea?"
  opciones:
    - {id: nunca, texto: "Nunca he fumado"}
    - {id: antes, texto: "Fumaba, pero lo dejé"}
    - {id: si, texto: "Sí, fumo o vapeo"}

alcohol:
  texto: "¿Con qué frecuencia toma bebidas con alcohol?"
  opciones:
    - {id: "no", texto: "No tomo"}
    - {id: ocasional, texto: "De vez en cuando, menos de una vez por semana"}
    - {id: semanal, texto: "Una o varias veces por semana"}
    - {id: diario, texto: "Casi todos los días"}

antecedentes:
  texto: "¿Alguno de sus padres o hermanos ha tenido…?"
  multiple: true
  opciones:
    - {id: diabetes, texto: "Diabetes"}
    - {id: corazon_temprano, texto: "Infarto o enfermedad del corazón antes de los 60 años"}
    - {id: hipertension, texto: "Presión alta"}
    - {id: colesterol_alto, texto: "Colesterol muy alto"}
    - {id: cancer_colon, texto: "Cáncer de colon"}

embarazo:
  texto: "¿Está embarazada?"
  solo_sexo: mujer
  opciones:
    - {id: "no", texto: "No"}
    - {id: si, texto: "Sí"}
    - {id: no_se, texto: "No estoy segura"}

ayuno:
  aviso: "La visita es en ayunas: no coma nada desde 10 horas antes. Puede tomar agua."
