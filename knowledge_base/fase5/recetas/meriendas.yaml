# Meriendas y refrigerios de Saludly · Fase 5
# Recetas propias de Saludly. Los nutrientes los calcula el código con recetas/alimentos.yaml.
# Gramos según el estado del identificador: cereales, tubérculos y leguminosas cocidos; carnes y pescados crudos.

- id: RCT-MER-001
  nombre: "Yogur natural con fresas y chía"
  tiempo_comida: merienda
  porciones: 1
  tiempo_min: 3
  dificultad: facil
  ingredientes:
    - {alimento: yogur_natural_sin_azucar, gramos: 150, medida: "3/4 de taza"}
    - {alimento: fresa, gramos: 100, medida: "6 fresas"}
    - {alimento: semillas_chia, gramos: 8, medida: "2 cucharaditas"}
  pasos:
