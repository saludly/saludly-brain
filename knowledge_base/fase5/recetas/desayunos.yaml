# Desayunos de Saludly · Fase 5
# Recetas propias de Saludly. Los nutrientes los calcula el código con recetas/alimentos.yaml.
# Gramos según el estado del identificador: cereales, tubérculos y leguminosas cocidos; carnes y pescados crudos.

- id: RCT-DES-001
  nombre: "Calentado de fríjol con huevo"
  tiempo_comida: desayuno
  porciones: 1
  tiempo_min: 15
  dificultad: facil
  ingredientes:
    - {alimento: frijol_rojo_cocido, gramos: 120, medida: "1/2 taza larga"}
    - {alimento: arroz_blanco_cocido, gramos: 80, medida: "1/2 taza"}
    - {alimento: huevo_entero, gramos: 50, medida: "1 huevo"}
    - {alimento: tomate, gramos: 40, medida: "1/2 tomate"}
    - {alimento: cebolla_larga, gramos: 15, medida: "1 tallo"}
    - {alimento: aceite_canola, gramos: 5, medida: "1 cucharadita"}
    - {alimento: sal, gramos: 1, medida: "1 pizca"}
  pasos:
    - "Sofría la cebolla y el tomate picados en el aceite."
    - "Agregue el fríjol y el arroz, y revuelva hasta que estén bien calientes."
    - "Fría o revuelva el huevo aparte y sírvalo encima."
  etiquetas: [colombiana, vegetariano, sin_lactosa, sin_gluten, economica]
  consejo: "Acompáñelo con media naranja para aprovechar mejor el hierro del fríjol."

