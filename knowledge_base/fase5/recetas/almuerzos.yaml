# Almuerzos de Saludly (Fase 5). Recetas propias, caseras y colombianas.
# Formato en knowledge_base/fase5/ESQUEMAS.md (sección 3). Los gramos son del total de la receta
# y del estado del alimento indicado en su id (cereales, tubérculos y leguminosas cocidos; carnes y pescados crudos).
# Los nutrientes y las etiquetas nutricionales los calcula el código con recetas/alimentos.yaml.
# estado_revision: aprobada (la aprueba Carlos)

- id: RCT-ALM-001
  nombre: "Ajiaco liviano de pollo"
  tiempo_comida: almuerzo
  porciones: 4
  tiempo_min: 60
  dificultad: media
  ingredientes:
    - {alimento: pechuga_pollo_cruda, gramos: 500, medida: "2 pechugas medianas"}
    - {alimento: papa_criolla_cocida, gramos: 400, medida: "16 papas criollas"}
    - {alimento: papa_cocida, gramos: 400, medida: "4 papas pastusas medianas"}
    - {alimento: mazorca_tierna, gramos: 300, medida: "2 mazorcas en trozos"}
    - {alimento: cebolla_larga, gramos: 60, medida: "2 tallos"}
    - {alimento: ajo, gramos: 10, medida: "2 dientes"}
    - {alimento: cilantro, gramos: 15, medida: "1 manojo pequeño"}
    - {alimento: caldo_casero_sin_sal, gramos: 1500, medida: "6 tazas"}
    - {alimento: aguacate, gramos: 200, medida: "1 aguacate mediano"}
    - {alimento: arroz_blanco_cocido, gramos: 240, medida: "1 1/2 tazas"}
    - {alimento: sal, gramos: 4, medida: "1 cucharadita rasa"}
  pasos:
    - "Cocina la pechuga en el caldo con la cebolla larga y el ajo durante 25 minutos."
    - "Saca el pollo, desméchalo y reserva."
    - "Agrega las papas en trozos y la mazorca, y cocina hasta que la papa criolla se deshaga y espese."
    - "Devuelve el pollo, ajusta con la sal y termina con cilantro picado."
    - "Sirve con aguacate y una porción pequeña de arroz."
  etiquetas: [colombiana, sin_gluten, sin_lactosa]
  consejo: "Cambia la crema de leche por aguacate: das la misma suavidad con grasa saludable."

