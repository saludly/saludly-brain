# Cenas de Saludly · 50 recetas (RCT-CEN-001 a RCT-CEN-050)
# Formato: knowledge_base/fase5/ESQUEMAS.md, sección 3. Los nutrientes los calcula el código con alimentos.yaml.
# Alimentos: solo los de recetas/ALIMENTOS_IDS.md (cereales, tubérculos y leguminosas cocidos; carnes y pescados crudos).
# Porción de cena para adulto: unas 350 a 600 kcal. Recetas propias de Saludly, aprobadas por Carlos.

- id: RCT-CEN-001
  nombre: "Crema de ahuyama con pollo desmechado"
  tiempo_comida: cena
  porciones: 2
  tiempo_min: 35
  dificultad: facil
  ingredientes:
    - {alimento: ahuyama, gramos: 500, medida: "2 tazas en cubos"}
    - {alimento: cebolla_cabezona, gramos: 60, medida: "media cebolla"}
    - {alimento: ajo, gramos: 6, medida: "2 dientes"}
    - {alimento: caldo_casero_sin_sal, gramos: 400, medida: "1 taza y media"}
    - {alimento: pechuga_pollo_cruda, gramos: 220, medida: "1 pechuga pequeña"}
    - {alimento: aceite_oliva, gramos: 10, medida: "2 cucharaditas"}
    - {alimento: pan_integral, gramos: 80, medida: "2 tajadas gruesas"}
    - {alimento: sal, gramos: 2, medida: "1 pizca grande"}
  pasos:
    - "Cocine la pechuga en el caldo durante 15 minutos y desméchela."
    - "Sofría la cebolla y el ajo en el aceite."
    - "Agregue la ahuyama y el caldo, y cocine hasta que ablande."
    - "Licúe, sazone con la sal y sirva con el pollo encima y el pan tostado."
  etiquetas: [colombiana, sin_lactosa, economica]
  consejo: "Cena dos a tres horas antes de acostarse para dormir más liviano."

